# golangci-lint v2 (make lint; CI runs the same via golangci-lint-action).
# Default linter set: errcheck, govet, ineffassign, staticcheck, unused.
version: "2"

run:
  # Lint the eval gate too (eval/ builds behind this tag).
  build-tags:
    - eval

linters:
  settings:
    errcheck:
      exclude-functions:
        # Deferred/fire-and-forget Close on read paths is idiomatic; the
        # write paths that must check Close do so explicitly. The interface
        # rule only matches interface-typed receivers, so the two concrete
        # read-path closers are listed too.
        - (io.Closer).Close
        - (*compress/gzip.Reader).Close
        - (*golang.org/x/net/http2.ClientConn).Close
  exclusions:
    rules:
      # Test HTTP handlers write responses constantly; unchecked
      # Fprintf/WriteString there is noise, not signal.
      - path: _test\.go
        linters:
          - errcheck
      # eval/ is the offline eval harness (build tag `eval`): fixture HTTP
      # handlers and a stderr scorecard — same noise class as test files.
      - path: ^eval/
        linters:
          - errcheck
      # x/net v0.63 deprecates http2.Transport/ClientConn in favour of
      # net/http's own HTTP/2 client. The --tls-mimic path stays on the
      # deprecated API for one reason (checked against Go 1.27.4): it must
      # advertise SETTINGS_MAX_HEADER_LIST_SIZE=262144, and net/http has no
      # field for that. http.HTTP2Config lacks it; the only net/http route
      # is Transport.MaxResponseHeaderBytes, to which the HTTP/2 code adds
      # an undocumented 320, so the fingerprint would hang on an internal
      # constant. http2.Transport.MaxHeaderListSize sets it exactly.
      # Handing over the utls connection is no longer the obstacle:
      # DialTLSContext now accepts any conn with *tls.Conn's
      # ConnectionState method. Drop this rule once HTTP2Config can set the
      # header list size; TestTLSMimicH2Settings pins the frames to keep.
      - path: ^internal/fetch/tls\.go$
        linters:
          - staticcheck
        text: "SA1019: .*(http2\\.|rt\\.h2\\.)"
    # third_party/ carries vendored upstream code (ADR-0001) kept byte-close
    # to upstream for easy syncing — exempt from lint, same as make vet.
    paths:
      - ^third_party/
