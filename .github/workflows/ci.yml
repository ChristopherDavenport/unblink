name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: make vet
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      # The MCP registry rejects a description over 100 characters, and the
      # publish workflow only finds out after a release is tagged.
      - name: server.json description fits the MCP registry limit
        run: jq -e '(.description | length) <= 100' server.json
      - name: test
        run: make test
      - name: eval
        run: make eval
